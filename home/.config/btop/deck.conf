#? Config file for btop v. 1.4
# Command Deck btop (launched by ~/.local/bin/ryoku-deck). Your own file;
# the shipped ~/.config/btop/btop.conf is left alone.
color_theme = "deck-blue"
theme_background = False
truecolor = True
vim_keys = True
rounded_corners = True
shown_boxes = "cpu mem"
graph_symbol = "braille"
update_ms = 1000
show_disks = True
mem_graphs = True
show_uptime = True
check_temp = True
show_battery = True
