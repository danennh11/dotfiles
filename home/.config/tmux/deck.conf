# Command Deck tmux (own server: tmux -L deck). Your normal tmux is untouched.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -g allow-passthrough on
set -g mouse on
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
setw -g aggressive-resize on

# Matugen palette rendered by Ryoku (follows wallpaper/theme changes)
source-file -q ~/.config/tmux/ryoku-colors.conf
# keep kitty's translucent background
set -g window-style "bg=default"
set -g window-active-style "bg=default"

# pane frames with titles
setw -g pane-border-status top
setw -g pane-border-lines heavy
setw -g pane-border-style "fg=#{@thm_outline}"
setw -g pane-active-border-style "fg=#{@thm_primary}"
setw -g pane-border-format "#{?pane_active,#[fg=#{@thm_bg}#,bg=#{@thm_primary}#,bold],#[fg=#{@thm_text_variant}]} #{pane_title} #[default]"

# slim status line on top
set -g status-position top
set -g status-style "bg=default,fg=#{@thm_text_variant}"
set -g status-left ""
set -g status-left-length 20
set -g status-right "#[fg=#{@thm_text_variant}]Alt+hjkl pindah · Alt+z zoom · Alt+q tutup  #[fg=#{@thm_primary}]%H:%M "
set -g status-right-length 80
set -g window-status-format ""
set -g window-status-current-format ""

# navigation without prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R
bind -n M-H resize-pane -L 3
bind -n M-J resize-pane -D 2
bind -n M-K resize-pane -U 2
bind -n M-L resize-pane -R 3
bind -n M-z resize-pane -Z
# Alt+q detaches: the deck keeps running and Super+Shift+F re-attaches it
bind -n M-q detach-client
# Alt+r re-runs fastfetch in the fetch pane
bind -n M-r send-keys -t deck:1.1 "clear; fastfetch -c ~/.config/fastfetch/deck.jsonc" Enter

# keep the fetch / stats / cava titles (fish would rename the pane)
setw -g allow-set-title off
setw -g automatic-rename off
setw -g allow-rename off
